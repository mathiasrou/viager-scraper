name: scraper

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'scrapers.py'
      - 'viager_common.py'
      - 'requirements.txt'
      - '.github/workflows/scraper.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://mathiasrou.github.io/viager-scraper/carte_globale.html
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run all scrapers
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CP_AUTORISES: ${{ vars.CP_AUTORISES }}
          CARTE_URL: https://mathiasrou.github.io/viager-scraper/carte_globale.html
        run: timeout 30m xvfb-run python main.py

      # Publie la carte sur GitHub Pages via l'API officielle :
      # s'active automatiquement, RIEN à configurer dans Settings.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload map artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # on ne publie que la carte (les autres fichiers restent privés au repo)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Commit historique
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add historique_global.csv || true
          git commit -m "update historique" || echo "no changes"
          git pull --rebase || true
          git push || true
