name: scraper

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'scrapers.py'
      - 'viager_common.py'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

# Un seul run à la fois : les runs en attente sont annulés,
# donc plus jamais 5 messages Telegram d'un coup.
concurrency:
  group: scraper-run
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run all scrapers
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CP_AUTORISES: ${{ vars.CP_AUTORISES }}
          CARTE_URL: https://mathiasrou.github.io/viager-scraper/carte_globale.html
        run: timeout 30m xvfb-run python main.py

      - name: Prepare publish folder
        run: |
          mkdir -p site
          if [ -f carte_globale.html ]; then
            cp carte_globale.html site/
          else
            echo "<html><body>Aucune carte générée ce run</body></html>" > site/carte_globale.html
          fi

      # enablement: true => ACTIVE GitHub Pages automatiquement,
      # aucune manipulation dans Settings > Pages nécessaire.
      - name: Setup Pages (avec activation auto)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload map artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Commit historique
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add historique_global.csv || true
          git commit -m "update historique" || echo "no changes"
          git pull --rebase || true
          git push || true
