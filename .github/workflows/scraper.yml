name: scraper

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
  # Un push qui touche le code ou ce fichier déclenche un run.
  # Les commits du bot (historique_global.csv) ne déclenchent rien.
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'scrapers.py'
      - 'viager_common.py'
      - 'requirements.txt'
      - '.github/workflows/scraper.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run all scrapers
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CP_AUTORISES: ${{ vars.CP_AUTORISES }}
        run: timeout 30m xvfb-run python main.py

      - name: Commit historique
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add historique_global.csv || true
          git commit -m "update historique" || echo "no changes"
          git pull --rebase || true
          git push || true
