name: scraper

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'scrapers.py'
      - 'viager_common.py'
      - 'requirements.txt'
      - '.github/workflows/scraper.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run all scrapers
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CP_AUTORISES: ${{ vars.CP_AUTORISES }}
          CARTE_URL: https://mathiasrou.github.io/viager-scraper/carte_globale.html
        run: timeout 30m xvfb-run python main.py

      # Préparer le dossier à publier sur Pages
      - name: Prepare map for Pages
        run: |
          mkdir -p map_publish
          if [ -f carte_globale.html ]; then
            cp carte_globale.html map_publish/
          else
            echo "<html><body>Aucune carte générée ce run</body></html>" > map_publish/carte_globale.html
          fi

      # Publication de la carte sur GitHub Pages (branche gh-pages).
      # Pages doit être activé UNE fois : Settings > Pages >
      # Source: Deploy from a branch > gh-pages / (root)
      - name: Publish map to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./map_publish
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false

      - name: Commit historique
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add historique_global.csv || true
          git commit -m "update historique" || echo "no changes"
          git pull --rebase || true
          git push || true
