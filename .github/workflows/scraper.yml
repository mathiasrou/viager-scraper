name: scraper

on:
  schedule:
    - cron: '0 11 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:

  run:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # =====================================================
      # DEPENDANCES LINUX
      # =====================================================

      - name: Install Linux dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      # =====================================================
      # PACKAGES PYTHON
      # =====================================================

      - name: Install Python packages
        run: |

          pip install pandas playwright folium requests beautifulsoup4

          playwright install chromium

      # =====================================================
      # VIAGER
      # =====================================================

      - name: Run Viager scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          timeout 10m python carte_finale_totale.py || echo "⏰ Timeout Viager"

      # =====================================================
      # ENCHERES IMMO
      # =====================================================

      - name: Run Encheres Immo scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          timeout 10m python encheres_immo.py || echo "⏰ Timeout Encheres Immo"

      # =====================================================
      # IMMONOTAIRES
      # =====================================================

      - name: Run Immonotaires scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          timeout 10m python immonotaires.py || echo "⏰ Timeout Immonotaires"

      # =====================================================
      # AVOVENTES
      # =====================================================

      - name: Run Avoventes scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          timeout 10m xvfb-run python avoventes.py || echo "⏰ Timeout Avoventes"

      # =====================================================
      # DEBUG FILES
      # =====================================================

      # - name: Upload debug avoventes
       #  uses: actions/upload-artifact@v4

        # with:
          # name: debug-avoventes

       #    path: |
         #    debug_avoventes.html
           #  debug_avoventes.png
             #debug_api.json

           #if-no-files-found: ignore

      # =====================================================
      # Vench
      # =====================================================
      
      - name: Run vench scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          timeout 10m xvfb-run python site_vench.py || echo "⏰ Timeout Vench"

      # =====================================================
      # DEBUG FILES
      # =====================================================
      # =====================================================
      # COMMIT HISTORIQUES
      # =====================================================

      - name: Commit historiques

        run: |

          git config --global user.name "bot"

          git config --global user.email "bot@bot.com"

          git add historique_ids.csv || true
          git add historique_immo.csv || true
          git add historique_immonotaires.csv || true
          git add historique_avoventes.csv || true
          git add historique_vench.csv || true
          
          git commit -m "update historiques" || echo "no changes"

          git pull --rebase || true

          git push || true
