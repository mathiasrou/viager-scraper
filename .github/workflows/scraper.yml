name: scraper

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'scrapers.py'
      - 'viager_common.py'
      - 'requirements.txt'
      - 'build_cp_bord_de_mer.py'
      - 'build_cp_tension.py'
      - '.github/workflows/scraper.yml'

permissions:
  contents: write

# Un seul run à la fois : les runs en attente sont annulés
concurrency:
  group: scraper-run
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Base CP bord de mer
        run: python build_cp_bord_de_mer.py

      - name: Base CP tension locative
        run: python build_cp_tension.py

      - name: Run all scrapers
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CP_AUTORISES: ${{ vars.CP_AUTORISES }}
          FILTRE_LITTORAL: ${{ vars.FILTRE_LITTORAL }}
          FILTRE_TENSION: ${{ vars.FILTRE_TENSION }}
        run: timeout 30m xvfb-run python main.py

      - name: Commit carte + historique
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add carte_globale.html historique_global.csv cp_bord_de_mer.csv cp_tension_locative.csv || true
          git commit -m "update carte + historique" || echo "no changes"
          git pull --rebase || true
          git push || true
