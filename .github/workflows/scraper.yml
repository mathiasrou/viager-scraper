name: scraper

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CLONE REPO
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # =====================================================
      # DEPENDANCES LINUX PLAYWRIGHT
      # =====================================================

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      # =====================================================
      # PYTHON PACKAGES
      # =====================================================

      - name: Install Python packages
        run: |
          pip install pandas playwright folium requests
          playwright install chromium

      # =====================================================
      # SCRIPT VIAGER
      # =====================================================

      - name: Run Viager scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python carte_finale_totale.py

      # =====================================================
      # SCRIPT ENCHERES IMMO
      # =====================================================

      - name: Run Encheres Immo scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python encheres_immo.py

      # =====================================================
      # SCRIPT ENCHERES IMMONOTAIRES
      # =====================================================

      - name: Run Encheres Immonotaires scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python immonotaires.py

        # =====================================================
      # SCRIPT ENCHERES IMMONOTAIRES
      # =====================================================

      - name: Run Encheres Avoventes
      - name: Upload debug html
        uses: actions/upload-artifact@v4
        with:
          name: debug-avoventes
          path: |
            debug_avoventes.html
            debug_api.json
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python avoventes.py
      # =====================================================
      
      # =====================================================
      # COMMIT HISTORIQUES
      # =====================================================

      - name: Commit historiques
        run: |

          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"

          git add historique_ids.csv
          git add historique_immo.csv
          git add historique_immonotaires.csv
          git add historique_avoventes.csv
          
          git commit -m "update historiques" || echo "no changes"

          git pull --rebase

          git push
